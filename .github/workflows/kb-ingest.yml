name: KB Ingest

on:
  push:
    branches: [master]
    paths:
      - "pages/**/*.md"
      - "pages/**/*.mdx"
  workflow_dispatch:
    inputs:
      full_ingest:
        description: "Ingest all pages (true) or only last commit diff (false)"
        default: "true"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect KB files and send in batches
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, glob, urllib.request, urllib.error

          API_URL = os.environ["API_GRAPH_URL"].rstrip("/")
          KB_SECRET = os.environ["KB_INGEST_SECRET"]
          BATCH_SIZE = 5   # files per POST request (smaller = faster response)
          MAX_WAIT = 1800  # seconds per request (embedding can take 7-20min per batch)

          full_ingest = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch" and \
                        os.getenv("INPUT_FULL_INGEST", "true").lower() != "false"

          all_files = []
          deleted = []

          if full_ingest:
              print("Mode: FULL ingest", file=sys.stderr)
              for pattern in ["pages/**/*.md", "pages/**/*.mdx"]:
                  for path in sorted(glob.glob(pattern, recursive=True)):
                      try:
                          all_files.append({"path": "docs/" + path, "content": open(path).read()})
                      except Exception as e:
                          print(f"WARN: {path}: {e}", file=sys.stderr)
          else:
              import subprocess
              diff = subprocess.run(
                  ["git","diff","--name-status","HEAD~1","HEAD","--","pages/**/*.md","pages/**/*.mdx"],
                  capture_output=True, text=True
              ).stdout.strip()
              print(f"Diff:\n{diff}", file=sys.stderr)
              for line in diff.splitlines():
                  if not line.strip(): continue
                  parts = line.split("\t", 1)
                  status, path = parts[0][0], parts[-1]
                  if not (path.endswith(".md") or path.endswith(".mdx")): continue
                  rel = "docs/" + path
                  if status == "D":
                      deleted.append(rel)
                  else:
                      try:
                          all_files.append({"path": rel, "content": open(path).read()})
                      except Exception as e:
                          print(f"WARN: {path}: {e}", file=sys.stderr)

          if not all_files and not deleted:
              print("Nothing to ingest.")
              sys.exit(0)

          print(f"Total: {len(all_files)} files, {len(deleted)} deleted")

          # Send deletions first
          if deleted:
              payload = json.dumps({"files": [], "deleted": deleted}).encode()
              req = urllib.request.Request(
                  f"{API_URL}/kb/ingest",
                  data=payload,
                  headers={"Content-Type":"application/json","X-KB-Secret":KB_SECRET},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  resp = json.loads(r.read())
              print(f"Deletions: {resp}")

          # Send files in batches
          total_upserted = 0
          total_errors = []
          for i in range(0, len(all_files), BATCH_SIZE):
              batch = all_files[i:i+BATCH_SIZE]
              batch_num = i // BATCH_SIZE + 1
              total_batches = (len(all_files) + BATCH_SIZE - 1) // BATCH_SIZE
              print(f"Batch {batch_num}/{total_batches}: {len(batch)} files ...")
              payload = json.dumps({"files": batch, "deleted": []}).encode()
              req = urllib.request.Request(
                  f"{API_URL}/kb/ingest",
                  data=payload,
                  headers={"Content-Type":"application/json","X-KB-Secret":KB_SECRET},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=MAX_WAIT) as r:
                      resp = json.loads(r.read())
                  print(f"  → chunks={resp.get('total_chunks')} upserted={resp.get('points_upserted')} errors={len(resp.get('errors',[]))}")
                  total_upserted += resp.get("points_upserted", 0)
                  total_errors.extend(resp.get("errors", []))
              except Exception as e:
                  print(f"  → FAILED: {e}", file=sys.stderr)
                  total_errors.append(str(e))

          print(f"\nDone: total_upserted={total_upserted} total_errors={len(total_errors)}")
          if total_errors:
              for err in total_errors[:10]:
                  print(f"  ERROR: {err}", file=sys.stderr)
              if len(total_errors) > 10:
                  sys.exit(1)
          PYEOF
        env:
          API_GRAPH_URL: ${{ secrets.API_GRAPH_URL }}
          KB_INGEST_SECRET: ${{ secrets.KB_INGEST_SECRET }}
          INPUT_FULL_INGEST: ${{ inputs.full_ingest }}
